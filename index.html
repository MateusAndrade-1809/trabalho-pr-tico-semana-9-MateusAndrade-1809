<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Ecommerce</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Mini Ecommerce</h1>
  </header>

  <main class="container">
    <section class="controls" aria-label="Controles do catalogo">
      <input id="search" type="text" placeholder="Buscar produto">

      <select id="category" aria-label="Categoria">
        <option value="Todas">Todas</option>
      </select>

      <button id="btnRender" type="button">Renderizar</button>
    </section>

    <section id="product-list" class="product-list" aria-label="Lista de produtos"></section>

    <section id="product-details" class="product-details" aria-live="polite">
      <h2>Detalhes do produto</h2>
      <p>Selecione um produto para ver mais informacoes.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
